# Modified by SparrowAndSnow and contributors for this Mosaic fork.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag, for example v0.19.0'
        required: true
        type: string
      runner:
        description: 'Standard macOS runner (try 26 if the 15 pool is queued)'
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-26
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    # macOS is required for mosaic-tty's Apple C interop artifacts. This host also builds
    # Linux/Windows klibs and all the JNI libraries embedded in the JVM publication.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check release version
        run: |
          python3 scripts/jitpack.py version "$RELEASE_VERSION"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check and stage all publications
        run: ./gradlew --no-parallel --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" spotlessCheck apiCheck jvmTest publishAllPublicationsToJitpackRepository -PVERSION_NAME="$RELEASE_VERSION"

      - name: Validate and package the Maven repository
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/jitpack.py pack build/jitpack/repository build/jitpack/mosaic-maven.tar.gz "$RELEASE_VERSION" "$RELEASE_COMMIT"

      - name: Install archive and compile an independent consumer
        run: |
          python3 scripts/jitpack.py install build/jitpack/mosaic-maven.tar.gz "$RELEASE_VERSION" "$RELEASE_COMMIT" build/jitpack/consumer-repository
          ./gradlew --no-parallel --max-workers=1 -p scripts/jitpack-consumer \
            -PmosaicRepository="$GITHUB_WORKSPACE/build/jitpack/consumer-repository" \
            -PmosaicVersion="$RELEASE_VERSION" \
            compileKotlinJvm compileKotlinLinuxArm64 compileKotlinLinuxX64 compileKotlinMingwX64 linkReleaseExecutableMacosArm64

      - name: Create release with JitPack artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            build/jitpack/mosaic-maven.tar.gz \
            build/jitpack/mosaic-maven.tar.gz.sha256 \
            --verify-tag --title "$RELEASE_VERSION" --notes-file "docs/releases/${RELEASE_VERSION#v}.md"

import org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget
import org.jetbrains.kotlin.gradle.plugin.mpp.NativeBuildType

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: "$rootDir/addAllTargets.gradle"

// Cross-platform micro-benchmarks. JVM: :samples:bench:run — Native (linux x64):
// ./gradlew :samples:bench:linkReleaseExecutableLinuxX64 && run the produced kexe.
kotlin {
	sourceSets {
		configureEach {
			languageSettings.optIn('kotlin.time.ExperimentalTime')
		}

		commonMain {
			dependencies {
				implementation projects.mosaicRuntime
				implementation projects.mosaicTty
				implementation projects.mosaicTtyTerminal
			}
		}
	}

	jvm {
		binaries {
			executable {
				mainClass = 'example.MainKt'
			}
		}
	}

	targets.withType(KotlinNativeTarget).configureEach { target ->
		target.binaries.executable {
			baseName = 'mosaic-benchmark'
			entryPoint = 'example.main'
			if (buildType == NativeBuildType.DEBUG) {
				linkTaskProvider.configure {
					enabled = false
				}
			}
		}
	}
}

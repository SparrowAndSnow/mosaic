import org.jetbrains.kotlin.gradle.tasks.KotlinNativeCompile
import org.jetbrains.kotlin.gradle.tasks.KotlinNativeLink

buildscript {
	dependencies {
		classpath libs.kotlin.plugin.core
		classpath libs.kotlin.plugin.compose
	}
	repositories {
		mavenCentral()
		google()
	}
}

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

kotlin {
	jvm()
	linuxArm64()
	linuxX64()
	macosArm64 {
		binaries.executable {
			entryPoint = 'consumer.main'
		}
	}
	mingwX64()

	sourceSets {
		commonMain {
			dependencies {
				implementation "com.github.SparrowAndSnow.mosaic:mosaic-runtime:${project.property('mosaicVersion')}"
				implementation "com.github.SparrowAndSnow.mosaic:mosaic-animation:${project.property('mosaicVersion')}"
				implementation "com.github.SparrowAndSnow.mosaic:mosaic-testing:${project.property('mosaicVersion')}"
				implementation "com.github.SparrowAndSnow.mosaic:mosaic-tty:${project.property('mosaicVersion')}"
			}
		}
	}
}

tasks.withType(KotlinNativeCompile).configureEach {
	compilerOptions.freeCompilerArgs.add('-Xpartial-linkage-loglevel=ERROR')
}

tasks.withType(KotlinNativeLink).configureEach {
	toolOptions.freeCompilerArgs.add('-Xpartial-linkage-loglevel=ERROR')
}

tasks.register('runJvmConsumer', JavaExec) {
	def compilation = kotlin.targets.jvm.compilations.main
	dependsOn(compilation.compileTaskProvider)
	classpath(compilation.output.allOutputs, compilation.runtimeDependencyFiles)
	mainClass = 'consumer.MainKt'
}

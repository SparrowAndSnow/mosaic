# Modified by SparrowAndSnow and contributors for this Mosaic fork.

GROUP=com.github.SparrowAndSnow.mosaic
VERSION_NAME=0.19.0

signAllPublications=false

POM_DESCRIPTION=Jetpack Compose for console UI

POM_URL=https://github.com/SparrowAndSnow/mosaic/
POM_SCM_URL=https://github.com/SparrowAndSnow/mosaic/
POM_SCM_CONNECTION=scm:git:https://github.com/SparrowAndSnow/mosaic.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/SparrowAndSnow/mosaic.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=jakewharton
POM_DEVELOPER_NAME=Jake Wharton
POM_DEVELOPER_URL=https://github.com/JakeWharton/

kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
# This is needed for the JB Compose runtime to link on native targets. They also use this flag
# in their samples. Over time it should be removed once they figure out why it was needed.
kotlin.native.cacheKind=none
kotlin.native.ignoreDisabledTargets=true

systemProp.org.gradle.internal.http.socketTimeout=120000

org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
